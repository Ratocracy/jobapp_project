input:
  raw_dir: raw_data

output:
  bronze_dir: data/bronze
  silver_dir: data/silver
  gold_dir: data/gold
  quarantine_dir: data/quarantine

runtime:
  sample_mode: true
  sample_fraction: 0.01
  random_seed: 5110
  spark_master: local[2]
  spark_task_cpus: 1
  driver_memory: 8g
  shuffle_partitions: 16
  output_partitions: 4
  resume_query_limit: 100
  resume_query_split: validation

nlp:
  num_features: 262144
  min_document_frequency: 2

retrieval:
  bucket_length: 0.5
  num_hash_tables: 3
  distance_threshold: 1.3
  top_k: 10

transformer:
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  max_tokens: 240
  overlap_tokens: 32
  device: cpu
